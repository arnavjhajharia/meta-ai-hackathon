<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InStep Simulator</title>
<style>
  :root {
    --bg: #0e1013; --panel: #171a1f; --line: #2a2f37; --text: #e9ecf1; --muted: #8b93a1;
    --accent: #7cd992; --warn: #ffb547; --bad: #ff6b6b; --hud: rgba(10, 12, 15, 0.72);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px;
    border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; letter-spacing: 0.02em; }
  header h1 span { color: var(--accent); }
  select, button, label.chk { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font: inherit; min-height: 40px; }
  select { max-width: 100%; }
  button { cursor: pointer; } button.primary { background: var(--accent); color: #0b0d10; border: 0; font-weight: 600; }
  label.chk { display: inline-flex; gap: 6px; align-items: center; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px; }
  .glasses { position: relative; background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; }
  .glasses video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .glasses canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hud { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px;
    pointer-events: none; }
  .hud .step { align-self: flex-start; background: var(--hud); border-radius: 999px; padding: 4px 12px;
    font-size: 13px; color: var(--muted); }
  .hud .cue { background: var(--hud); border-radius: 12px; padding: 10px 14px; font-size: 20px; font-weight: 600;
    backdrop-filter: blur(6px); transition: opacity .3s; }
  .hud .cue.skip { border-left: 4px solid var(--bad); } .hud .cue.stall { border-left: 4px solid var(--warn); }
  .hud .cue.advance { border-left: 4px solid var(--accent); }
  .frozen-veil { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); font-size: 18px; color: var(--muted); }
  .frozen .frozen-veil { display: flex; }
  .controls { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .controls .time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .phone { background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 14px; }
  .phone h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 4px 4px 10px; }
  .phone video { width: 100%; border-radius: 14px; background: #000; aspect-ratio: 16 / 9; display: block; }
  .tip { margin: 10px 4px; color: var(--muted); font-size: 14px; min-height: 1.4em; }
  ol.steps { list-style: none; margin: 0; padding: 0; max-height: 46vh; overflow: auto; }
  ol.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 10px 6px; border-top: 1px solid var(--line);
    min-height: 44px; cursor: pointer; }
  ol.steps li .n { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); display: grid;
    place-items: center; font-size: 12px; color: var(--muted); }
  ol.steps li.current { background: rgba(124, 217, 146, .08); border-radius: 10px; }
  ol.steps li.current .n { border-color: var(--accent); color: var(--accent); }
  ol.steps li.done .n { background: var(--accent); color: #0b0d10; border-color: var(--accent); }
  ol.steps li.skipped .n { background: var(--bad); color: #0b0d10; border-color: var(--bad); }
  ol.steps li .t { font-weight: 600; } ol.steps li .i { color: var(--muted); font-size: 13px; }
  .strip { grid-column: 1 / -1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .strip canvas { width: 100%; height: 70px; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .log { grid-column: 1 / -1; font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); max-height: 160px; overflow: auto; }
  .status { color: var(--muted); }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
    .hud .cue { font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>InStep <span>simulator</span></h1>
  <select id="lesson" aria-label="Lesson"></select>
  <select id="clip" aria-label="Learner recording"></select>
  <label class="chk"><input type="checkbox" id="judge" checked> photo checks</label>
  <label class="chk"><input type="checkbox" id="speak" checked> speak</label>
  <label class="chk"><input type="checkbox" id="boxes"> boxes</label>
  <button class="primary" id="open">Load</button>
  <span class="status" id="status"></span>
</header>
<main>
  <section>
    <div class="glasses" id="glasses">
      <video id="learner" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="frozen-veil">Paused while you look away</div>
      <div class="hud">
        <div class="step" id="hudStep">Load a lesson and a recording</div>
        <div class="cue" id="hudCue" style="opacity:0"></div>
      </div>
    </div>
    <div class="controls">
      <button id="play" disabled>Play</button>
      <button id="restart" disabled>Restart</button>
      <span class="time" id="time">0.0 s</span>
    </div>
  </section>
  <aside class="phone">
    <h2>On your phone</h2>
    <video id="tutorial" playsinline muted></video>
    <div class="tip" id="tip"></div>
    <ol class="steps" id="steps"></ol>
  </aside>
  <div class="strip">
    <canvas id="strip"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>advance</span>
      <span><i style="background:var(--bad)"></i>skip</span>
      <span><i style="background:var(--warn)"></i>stall</span>
      <span><i style="background:#888"></i>frozen / resume</span>
      <span>solid: InStep &nbsp; hollow: your labels</span>
    </div>
  </div>
  <div class="log" id="log"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const COLORS = { advance: "#7cd992", skip: "#ff6b6b", stall: "#ffb547", frozen: "#888", resume: "#888" };
let lesson = null, ws = null, duration = 0, events = [], labels = [], current = 0, timer = null, stepState = {};

async function boot() {
  const cat = await (await fetch("/api/catalog")).json();
  for (const [id, l] of Object.entries(cat.lessons)) $("lesson").add(new Option(`${l.title} (${id})`, id));
  for (const c of cat.clips) $("clip").add(new Option(c, c));
  const q = new URLSearchParams(location.search);
  if (q.get("lesson")) $("lesson").value = q.get("lesson");
  if (q.get("clip")) $("clip").value = q.get("clip");
  if (q.get("lesson") && q.get("clip")) openSession();
}

async function openSession() {
  const lid = $("lesson").value, clip = $("clip").value;
  if (!lid || !clip) return;
  const data = await (await fetch(`/api/lesson/${lid}`)).json();
  lesson = data.lesson; events = []; current = 0; stepState = {};
  labels = (await (await fetch(`/api/labels/${clip}`)).json()).rows || [];
  $("learner").src = `/media/${clip}`;
  if (data.tutorial) $("tutorial").src = `/media/${data.tutorial}`;
  renderSteps(); showStep(0, false); $("log").textContent = "";
  if (ws) ws.close();
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify({ type: "open", clip, lesson: lid, judge: $("judge").checked }));
  ws.onmessage = (m) => handle(JSON.parse(m.data));
  $("status").textContent = "Connecting";
}

function handle(msg) {
  if (msg.type === "status") $("status").textContent = msg.text;
  if (msg.type === "ready") {
    duration = msg.duration; $("status").textContent = "Ready"; $("play").disabled = false; $("restart").disabled = false;
    drawStrip();
  }
  if (msg.type === "tick") {
    $("glasses").classList.toggle("frozen", msg.frozen);
    drawOverlay(msg.last);
    for (const e of msg.events) onEvent(e);
  }
}

function onEvent(e) {
  events.push(e);
  const line = `${e.t_s.toFixed(1).padStart(6)}s  ${e.kind.padEnd(8)} ${(e.step_id || "").padEnd(24)} ${e.cue || ""}`;
  $("log").textContent = line + "\n" + $("log").textContent;
  if (e.kind === "advance") { stepState[e.step_id] = stepState[e.step_id] || "done"; showStep(stepIndex(e.step_id) + 1, true); }
  if (e.kind === "skip") stepState[e.step_id] = "skipped";
  if (e.kind === "stall") { const t = $("tutorial"); const s = lesson.steps[current]; if (s) playSpan(s); }
  if (e.cue && e.kind !== "frozen" && e.kind !== "resume") say(e.cue, e.kind);
  renderSteps(); drawStrip();
}

function stepIndex(id) { return lesson.steps.findIndex((s) => s.id === id); }

function showStep(i, speakIt) {
  current = Math.min(i, lesson.steps.length);
  const s = lesson.steps[current];
  $("hudStep").textContent = s ? `Step ${current + 1} of ${lesson.steps.length}: ${s.title}` : "All steps done";
  $("tip").textContent = s && s.tips.length ? `"${s.tips[0].text}"` : "";
  if (s) playSpan(s);
  if (!speakIt && s) setCue(`${s.title}. ${s.instruction}`, "advance");
}

function playSpan(s) {
  const t = $("tutorial"), sp = s.span || s.span_model; if (!sp || !t.src) return;
  t.currentTime = sp.start_s; t.play().catch(() => {});
  t.ontimeupdate = () => { if (t.currentTime >= sp.end_s) t.currentTime = sp.start_s; };
}

function setCue(text, kind) {
  const c = $("hudCue"); c.textContent = text; c.className = `cue ${kind}`; c.style.opacity = 1;
}

function say(text, kind) {
  setCue(text, kind);
  if (!$("speak").checked || !window.speechSynthesis) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1.0; speechSynthesis.speak(u);
}

function renderSteps() {
  const ol = $("steps"); ol.innerHTML = "";
  lesson.steps.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = [i === current ? "current" : "", stepState[s.id] || ""].join(" ");
    li.innerHTML = `<span class="n">${i + 1}</span><span><div class="t"></div><div class="i"></div></span>`;
    li.querySelector(".t").textContent = s.title; li.querySelector(".i").textContent = s.instruction;
    li.onclick = () => playSpan(s);
    ol.appendChild(li);
  });
}

function drawOverlay(last) {
  const cv = $("overlay"), v = $("learner"); const r = cv.getBoundingClientRect();
  cv.width = r.width; cv.height = r.height; const g = cv.getContext("2d"); g.clearRect(0, 0, cv.width, cv.height);
  if (!$("boxes").checked || !last || !last.box || !v.videoWidth) return;
  const scale = Math.min(cv.width / v.videoWidth, cv.height / v.videoHeight);
  const w = v.videoWidth * scale, h = v.videoHeight * scale, ox = (cv.width - w) / 2, oy = (cv.height - h) / 2;
  const [x0, y0, x1, y1] = last.box; g.strokeStyle = "#7cd992"; g.lineWidth = 2;
  g.strokeRect(ox + x0 * w, oy + y0 * h, (x1 - x0) * w, (y1 - y0) * h);
  g.fillStyle = "#7cd992"; g.font = "12px sans-serif"; g.fillText(`seen: ${last.seen.join(", ")}`, ox + x0 * w + 4, oy + y0 * h + 14);
}

function drawStrip() {
  const cv = $("strip"), r = cv.getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = 70 * devicePixelRatio;
  const g = cv.getContext("2d"); g.scale(devicePixelRatio, devicePixelRatio); const W = r.width, D = Math.max(duration, 1);
  g.fillStyle = "#2a2f37"; g.fillRect(0, 34, W, 2);
  for (const e of events) { g.fillStyle = COLORS[e.kind] || "#fff"; g.fillRect((e.t_s / D) * W - 1, 8, 3, 26); }
  for (const l of labels) { g.strokeStyle = COLORS[l.kind] || "#fff"; g.lineWidth = 2; g.strokeRect((l.t_s / D) * W - 3, 40, 6, 22); }
  const t = $("learner").currentTime; g.fillStyle = "#e9ecf1"; g.fillRect((t / D) * W, 0, 1, 70);
}

function tick() {
  const t = $("learner").currentTime; $("time").textContent = `${t.toFixed(1)} s`;
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "clock", t }));
  drawStrip();
}

$("open").onclick = openSession;
$("play").onclick = () => { const v = $("learner"); if (v.paused) { v.play(); $("play").textContent = "Pause"; } else { v.pause(); $("play").textContent = "Play"; } };
$("restart").onclick = () => { const v = $("learner"); v.currentTime = 0; events = []; stepState = {}; showStep(0, false); renderSteps(); tick(); };
$("learner").addEventListener("play", () => { clearInterval(timer); timer = setInterval(tick, 250); });
$("learner").addEventListener("pause", () => { clearInterval(timer); tick(); });
$("learner").addEventListener("seeked", () => { if ($("learner").currentTime < 0.3) { events = []; stepState = {}; showStep(0, false); } tick(); });
window.addEventListener("resize", drawStrip);
boot();
</script>
</body>
</html>
